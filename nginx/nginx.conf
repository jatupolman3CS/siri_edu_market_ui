# seo-ssr v1 §4.3: crawler/social-preview-bot User-Agent sniff. Bots matching this map get
# routed (below) to the backend's crawler-only HTML-snapshot endpoints (`/api/seo/...`, §3);
# every other request (real browsers) falls through to the SPA exactly as before.
map $http_user_agent $seo_is_crawler {
    default 0;
    "~*(googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|whatsapp|line|pinterest|redditbot|applebot|ahrefsbot|semrushbot|bot|crawler|spider)" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed assets forever
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets (short cache)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # seo-ssr v1 §4.3: crawler/social-preview bots hitting one of these 3 dynamic routes get
    # rewritten to the backend's HTML-snapshot endpoint (`^~ /api/` below proxies it through) —
    # real browsers (map value 0) always fall through to `try_files` untouched, so this changes
    # nothing about the SPA experience for actual users (regression guard, AC-15/16/17).
    location ~ ^/document/(?<seo_doc_id>[0-9a-fA-F-]{36})/?$ {
        if ($seo_is_crawler = 1) {
            rewrite ^ /api/seo/document/$seo_doc_id last;
        }
        try_files $uri /index.html;
    }
    location ~ ^/category/(?<seo_cat_slug>[^/]+)/?$ {
        if ($seo_is_crawler = 1) {
            rewrite ^ /api/seo/category/$seo_cat_slug last;
        }
        try_files $uri /index.html;
    }
    location ~ ^/store/(?<seo_store_id>[0-9a-fA-F-]{36})/?$ {
        if ($seo_is_crawler = 1) {
            rewrite ^ /api/seo/store/$seo_store_id last;
        }
        try_files $uri /index.html;
    }

    # Proxy Previews to the backend container (contains generated watermarked raster images).
    location ^~ /Previews/ {
        proxy_pass         http://backend:8080/Previews/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy API calls to the backend container.
    # `^~` is load-bearing: without it the regex location above
    # (`\.(ico|png|jpg|jpeg|gif|svg|webp)$`) wins for URLs such as
    # /api/files/download/avatars/2026/05/abc.webp and answers 404 from try_files
    # instead of proxying. nginx prefers a matching regex over a plain prefix match.
    location ^~ /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Angular SPA — fallback to index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
