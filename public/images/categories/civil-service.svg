    <linearGradient id="cs-roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="0.55" stop-color="#db2777"/><stop offset="1" stop-color="#831843"/></linearGradient>
    <linearGradient id="cs-col" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fce7f3"/></linearGradient>
