<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="SIRIEDUMARKET">
  <defs>
    <linearGradient id="ah-page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fce7f3"/></linearGradient>
    <linearGradient id="ah-card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient>
    <linearGradient id="ah-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#be185d"/></linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="180" cy="222" rx="140" ry="10" fill="#831843" opacity="0.25"/>
