  <path d="M268 80c-32-10-62-6-88 14v112c26-20 56-24 88-14z" fill="#ffffff"/>
  <path d="M110 116c18-4 36-1 54 8M110 140c18-4 36-1 54 8M110 164c18-4 36-1 54 8M196 124c18-9 36-12 54-8M196 148c18-9 36-12 54-8M196 172c18-9 36-12 54-8" fill="none" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
