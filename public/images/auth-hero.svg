  <g transform="rotate(-10 78 128)">
    <rect x="34" y="70" width="88" height="116" rx="12" fill="url(#ah-card)"/>
    <rect x="46" y="84" width="64" height="40" rx="6" fill="#fbcfe8"/>
    <path d="M54 116l14-16 10 10 8-6 16 12" fill="none" stroke="#db2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 138h56M46 152h40" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
    <rect x="46" y="164" width="34" height="12" rx="6" fill="url(#ah-accent)"/>
  </g>
  <!-- right document card -->
  <g transform="rotate(10 282 128)">
    <rect x="238" y="70" width="88" height="116" rx="12" fill="url(#ah-card)"/>
    <path d="M254 92h56M254 106h56M254 120h36" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
