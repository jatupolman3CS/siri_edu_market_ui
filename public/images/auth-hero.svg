  <path d="M300 22l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#fde68a"/>
  <path d="M52 30l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffffff" opacity="0.85"/>
