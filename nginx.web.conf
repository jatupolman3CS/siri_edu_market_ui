# SIRIEDUMARKET web — variant "SPA อย่างเดียว ไม่ proxy API"
#
# ใช้เมื่อ reverse proxy ข้างนอก (เช่น nginx บนโฮสต์ของ siriedumarket.siristudiophoto.com
# หรือ ingress) เป็นคนส่ง /SIRIEDUMARKET.Api/ ไปหา backend เอง — คอนเทนเนอร์นี้เสิร์ฟแค่ไฟล์ static
#
# ค่า default ของ image คือ nginx/nginx.conf (proxy /SIRIEDUMARKET.Api/ → backend:8080)
# ซึ่งเป็นตัวที่ docker-compose.yml ที่ root ใช้ จะสลับมาใช้ไฟล์นี้ให้ build ด้วย:
#   docker build --build-arg NGINX_CONF=nginx.web.conf -t siriedumarket-web:standalone .
#
# ⚠️ โหมดนี้เบราว์เซอร์ยิง API ข้าม origin → ต้องมี origin ของหน้าเว็บอยู่ใน
#    Cors:AllowedOrigins ฝั่ง backend (appsettings.json / CORS_ORIGIN_* ใน .env)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ไฟล์ที่มี content hash ในชื่อ — cache ได้ยาวเพราะชื่อเปลี่ยนทุกครั้งที่ของเปลี่ยน
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Angular SPA — route ฝั่ง client ทั้งหมดตกมาที่ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
