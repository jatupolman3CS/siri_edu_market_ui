<div class="min-h-screen bg-canvas flex flex-col lg:flex-row">
      <app-global-loader />
      <!-- Sidebar -->
      <aside
        class="hidden lg:flex flex-col w-72 bg-white border-r border-line p-5 sticky top-0 h-screen overflow-hidden shrink-0 z-30"
      >
        <div class="shrink-0 mb-4">
          <div class="flex items-center justify-between">
            <app-logo link="/seller" />
            <app-notification-bell variant="icon" />
          </div>

          <div class="mt-2.5 pl-1">
            <span class="pill-pink !text-[10px]">
              <app-icon name="dashboard" [size]="11" />
              STUDIO MODE
            </span>
          </div>
        </div>

        <nav class="flex flex-col gap-1 flex-1 min-h-0 overflow-y-auto pr-1">
          @for (item of navItems(); track item.href) {
            <a
              [routerLink]="item.href"
              routerLinkActive="!bg-pink-50 !text-pink-600 !border-pink-200"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              class="flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-medium text-ink-soft border border-transparent hover:bg-pink-50 hover:text-pink-600 transition-colors"
            >
              <app-icon [name]="item.icon" [size]="18" />
              <span class="flex-1 truncate">{{ item.label }}</span>
            </a>
          }
        </nav>

        <div class="shrink-0 pt-3 border-t border-line mt-2 flex flex-col gap-1">
          <a
            routerLink="/"
            class="flex items-center gap-2 px-3.5 py-2 rounded-2xl text-sm text-ink-muted hover:bg-pink-50 hover:text-pink-600 transition-colors"
          >
            <app-icon name="arrow-left" [size]="16" />
            {{ 'nav.backToMarket' | trans }}
          </a>

          <button
            type="button"
            (click)="signOut()"
            class="flex items-center gap-2 px-3.5 py-2 rounded-2xl text-sm text-rose-500 hover:bg-rose-50 transition-colors"
          >
            <app-icon name="logout" [size]="16" />
            {{ 'nav.signOut' | trans }}
          </button>

          @if (auth.user(); as u) {
            <div
              class="mt-2 flex items-center gap-3 p-2.5 rounded-2xl bg-pink-50 border border-line"
            >
              <img
                appImgFallback
                [src]="avatarSrc()"
                class="w-8 h-8 rounded-full object-cover ring-2 ring-white shrink-0"
                [alt]="u.name"
              />
              <div class="flex-1 min-w-0">
                <div class="text-sm font-bold text-ink truncate">{{ u.name }}</div>
                <div class="text-xs text-ink-muted truncate">Siri Studio</div>
              </div>
            </div>
          }
        </div>
      </aside>

      <!-- Mobile top bar -->
      <header
        class="lg:hidden sticky top-0 z-20 bg-white border-b border-line w-full"
      >
        <div class="flex items-center justify-between px-4 h-16 gap-2">
          <app-logo link="/seller" />
          <div class="flex items-center gap-2 shrink-0">
            <app-notification-bell variant="icon" />
            <a routerLink="/" class="btn-ghost !py-1.5 !px-2.5 text-xs whitespace-nowrap">
              {{ 'nav.backToMarket' | trans }}
            </a>
            <button
              type="button"
              (click)="signOut()"
              class="flex items-center gap-1 !py-1.5 !px-2.5 text-xs text-rose-500 whitespace-nowrap"
            >
              <app-icon name="logout" [size]="14" />
              {{ 'nav.signOut' | trans }}
            </button>
          </div>
        </div>
        <!-- Trailing fade so a scrollable tab bar with more tabs off-screen is noticeable. -->
        <div class="relative">
          <nav class="flex overflow-x-auto px-4 pb-3 gap-2">
            @for (item of navItems(); track item.href) {
              <a
                [routerLink]="item.href"
                routerLinkActive="!bg-pink-500 !text-white"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                class="px-3 py-1.5 rounded-full bg-pink-50 text-ink-soft text-xs font-medium whitespace-nowrap"
              >
                {{ item.label }}
              </a>
            }
          </nav>
          <div
            class="pointer-events-none absolute right-0 top-0 bottom-3 w-10 bg-gradient-to-l from-white to-transparent"
          ></div>
        </div>
      </header>

      <!-- Main -->
      <main class="flex-1 min-w-0">
        <div class="p-4 sm:p-6 lg:p-10">
          <router-outlet />
        </div>
      </main>
    </div>
