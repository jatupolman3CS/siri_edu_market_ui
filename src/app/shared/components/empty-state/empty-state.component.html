<div
      class="flex flex-col items-center justify-center text-center py-16 px-6"
    >
      @if (illustrationSrc(); as src) {
        <img
          class="w-32 h-32 mb-5 select-none"
          [src]="src"
          alt=""
          aria-hidden="true"
          width="128"
          height="128"
          loading="lazy"
          decoding="async"
          data-testid="empty-state-illustration"
        />
      } @else {
        <div
          class="w-24 h-24 rounded-3xl bg-gradient-to-br from-brand-100 to-brand-50 flex items-center justify-center text-4xl mb-5"
          data-testid="empty-state-emoji"
        >
          {{ emoji() }}
        </div>
      }
      <h3 class="text-lg font-bold text-ink">{{ title() }}</h3>
      @if (description()) {
        <p class="text-sm text-ink-muted mt-1 max-w-sm">{{ description() }}</p>
      }
      <ng-content />
    </div>
