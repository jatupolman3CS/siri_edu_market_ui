<section class="card-tile" id="profile">
  <div class="flex items-start gap-3 mb-5">
    <div class="w-11 h-11 rounded-2xl bg-pink-50 text-pink-600 flex items-center justify-center flex-shrink-0">
      <app-icon name="user" [size]="18" />
    </div>
    <div>
      <h2 class="text-lg font-bold text-ink mb-1">{{ 'shared.profileEditor.title' | trans }}</h2>
      <p class="text-xs text-ink-muted">{{ 'shared.profileEditor.subtitle' | trans }}</p>
    </div>
  </div>

  <div class="flex items-center gap-5 mb-6 flex-wrap">
    <label class="relative flex-shrink-0 cursor-pointer group">
      <input type="file" accept="image/*" class="hidden" (change)="onAvatarSelected($event)" />
      <img
        appImgFallback
        [src]="avatarSrc()"
        class="w-24 h-24 rounded-[1.75rem] object-cover ring-4 ring-pink-100 transition-opacity group-hover:opacity-80"
        [alt]="'shared.profileEditor.profileImageAlt' | trans"
      />
      <span
        class="absolute -bottom-1.5 -right-1.5 w-8 h-8 rounded-xl bg-white border border-line shadow-soft flex items-center justify-center text-pink-600"
      >
        <app-icon name="edit" [size]="14" />
      </span>
    </label>
    <div class="flex flex-col gap-2">
      <label class="btn-ghost !py-2 !px-4 text-sm cursor-pointer w-fit">
        <input type="file" accept="image/*" class="hidden" (change)="onAvatarSelected($event)" />
        @if (avatarUploading()) { {{ 'common.loading' | trans }} } @else { {{ 'shared.profileEditor.uploadProfileImage' | trans }} }
      </label>
      <p class="text-xs text-ink-muted max-w-xs">{{ 'shared.profileEditor.supportedFormats' | trans }}</p>
    </div>
  </div>

  <div class="grid gap-4" [class.sm:grid-cols-2]="!!secondaryLabel()">
    <div>
      <label class="text-xs font-semibold text-ink-soft mb-2 block">{{ 'shared.profileEditor.displayName' | trans }}</label>
      <input
        class="input-soft"
        [ngModel]="displayName()"
        (ngModelChange)="displayName.set($event)"
        name="displayName"
        autocomplete="name"
        maxlength="200"
      />
    </div>
    @if (secondaryLabel()) {
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ secondaryLabelText() }}
        </label>
        <input class="input-soft opacity-70" [value]="secondaryLabel()" readonly />
      </div>
    }
  </div>

  <div class="flex justify-end mt-6">
    <button type="button" class="btn-pink !px-7" [disabled]="saving()" (click)="save()">
      <app-icon name="check" [size]="16" />
      {{ saving() ? ('common.saving' | trans) : ('shared.profileEditor.saveProfile' | trans) }}
    </button>
  </div>
</section>
