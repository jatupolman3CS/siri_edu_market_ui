<section class="card-soft p-6">
  <h2 class="text-lg font-bold text-ink mb-1">โปรไฟล์</h2>
  <p class="text-xs text-ink-muted mb-5">ชื่อที่แสดงและรูปโปรไฟล์ของคุณ</p>

  <div class="flex items-center gap-5 mb-6 flex-wrap">
    <img
      [src]="avatarSrc()"
      class="w-20 h-20 rounded-3xl object-cover ring-2 ring-pink-100"
      alt="รูปโปรไฟล์"
    />
    <div class="flex flex-col gap-2">
      <label class="btn-ghost !py-2 !px-4 text-sm cursor-pointer w-fit">
        <input type="file" accept="image/*" class="hidden" (change)="onAvatarSelected($event)" />
        @if (avatarUploading()) { กำลังอัปโหลด… } @else { อัปโหลดรูปโปรไฟล์ }
      </label>
      <p class="text-xs text-ink-muted max-w-xs">รองรับ JPG / PNG / WebP</p>
    </div>
  </div>

  <div class="grid gap-4" [class.sm:grid-cols-2]="!!secondaryLabel()">
    <div>
      <label class="text-xs font-semibold text-ink-soft mb-2 block">ชื่อที่แสดง</label>
      <input
        class="input-soft"
        [(ngModel)]="displayName"
        name="displayName"
        autocomplete="name"
        maxlength="200"
      />
    </div>
    @if (secondaryLabel()) {
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ secondaryLabelText() }}
        </label>
        <input class="input-soft opacity-70" [value]="secondaryLabel()" readonly />
      </div>
    }
  </div>

  <div class="flex justify-end mt-6">
    <button type="button" class="btn-pink !px-7" [disabled]="saving()" (click)="save()">
      <app-icon name="check" [size]="16" />
      {{ saving() ? 'กำลังบันทึก…' : 'บันทึกโปรไฟล์' }}
    </button>
  </div>
</section>
