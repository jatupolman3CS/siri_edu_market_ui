<button
  nz-dropdown
  [nzDropdownMenu]="langMenu"
  nzTrigger="click"
  [nzPlacement]="placement()"
  type="button"
  class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-semibold transition-all border cursor-pointer"
  [class.bg-white]="theme() === 'light'"
  [class.text-ink-soft]="theme() === 'light'"
  [class.border-line]="theme() === 'light'"
  [class.hover:border-pink-300]="theme() === 'light'"
  [class.bg-white/10]="theme() === 'dark'"
  [class.text-pink-100]="theme() === 'dark'"
  [class.border-white/10]="theme() === 'dark'"
  [class.hover:bg-white/20]="theme() === 'dark'"
  [attr.aria-label]="translation.t('header.switchLanguage')"
>
  <span class="font-bold">{{ translation.currentLang() === 'th' ? 'TH' : 'EN' }}</span>
  <svg class="w-3.5 h-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
  </svg>
</button>

<nz-dropdown-menu #langMenu="nzDropdownMenu">
  <ul nz-menu class="!rounded-2xl !p-1.5 !shadow-popover !border !border-line min-w-[88px]">
    <li
      nz-menu-item
      (click)="setLanguage('th')"
      class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-xl !text-xs !font-medium hover:!bg-pink-50 cursor-pointer"
      [class.!bg-pink-50]="translation.currentLang() === 'th'"
      [class.!text-pink-600]="translation.currentLang() === 'th'"
      [class.!font-bold]="translation.currentLang() === 'th'"
    >
      <span>TH</span>
      @if (translation.currentLang() === 'th') {
        <span class="ml-auto text-pink-600 font-bold">✓</span>
      }
    </li>
    <li
      nz-menu-item
      (click)="setLanguage('en')"
      class="!flex !items-center !gap-2.5 !px-3 !py-2 !rounded-xl !text-xs !font-medium hover:!bg-pink-50 cursor-pointer"
      [class.!bg-pink-50]="translation.currentLang() === 'en'"
      [class.!text-pink-600]="translation.currentLang() === 'en'"
      [class.!font-bold]="translation.currentLang() === 'en'"
    >
      <span>EN</span>
      @if (translation.currentLang() === 'en') {
        <span class="ml-auto text-pink-600 font-bold">✓</span>
      }
    </li>
  </ul>
</nz-dropdown-menu>
