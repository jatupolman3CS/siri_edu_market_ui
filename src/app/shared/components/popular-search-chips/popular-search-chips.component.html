@if (terms().length > 0) {
  <div class="flex flex-wrap items-center gap-2">
    @if (label()) {
      <span class="text-xs text-ink-muted mr-1">{{ label() }}</span>
    }
    @for (t of terms(); track t.term) {
      <a
        [routerLink]="['/marketplace']"
        [queryParams]="{ q: t.term }"
        class="pill-soft hover:!bg-white hover:!border-pink-300 hover:!text-pink-600"
      >
        {{ t.term }}
        @if (t.isRising) {
          <span title="มาแรงในสัปดาห์นี้">🔥</span>
        }
      </a>
    }
  </div>
} @else if (fallbackTerms().length > 0) {
  <div class="flex flex-wrap items-center gap-2">
    @if (label()) {
      <span class="text-xs text-ink-muted mr-1">{{ label() }}</span>
    }
    @for (q of fallbackTerms(); track q) {
      <a
        [routerLink]="['/marketplace']"
        [queryParams]="{ q }"
        class="pill-soft hover:!bg-white hover:!border-pink-300 hover:!text-pink-600"
      >
        {{ q }}
      </a>
    }
  </div>
}
