<section
  class="card-soft p-6 md:p-8 mb-6 bg-gradient-to-r from-brand-50/40 via-surface to-brand-50/20 border border-line relative overflow-hidden"
>
  <div class="relative">
    @if (eyebrow()) {
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-brand-100 text-brand-700 border border-line mb-3">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
        <span>{{ eyebrow() }}</span>
      </div>
    }
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-ink mb-1.5">
      {{ title() }}
    </h1>
    @if (description()) {
      <p class="text-sm sm:text-base text-ink-soft max-w-2xl">{{ description() }}</p>
    }
    <ng-content />
  </div>
</section>
