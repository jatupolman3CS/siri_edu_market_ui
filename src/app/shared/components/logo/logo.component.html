<!-- G-12 / R-2: the 40px tile made the link 40 tall (and 40 wide when the wordmark is hidden below
     360); touch devices get a 44x44 minimum, fine pointers keep the 40px density. -->
<a
  [routerLink]="link()"
  class="inline-flex items-center gap-2.5 group min-w-0 max-w-full [@media(pointer:coarse)]:min-h-11 [@media(pointer:coarse)]:min-w-11"
>
      <img
        src="logo.svg"
        alt=""
        width="40"
        height="40"
        class="shrink-0 w-10 h-10 rounded-2xl shadow-soft transition-transform group-hover:rotate-[-6deg]"
      />
      @if (showText()) {
        <span class="logo__wordmark flex flex-col min-w-0 leading-none">
          <span class="truncate text-[15px] font-extrabold tracking-tight text-ink">
            SIRIEDUMARKET
          </span>
          <span class="truncate text-[10px] uppercase tracking-[0.2em] text-brand-500 mt-1">
            Education Marketplace
          </span>
        </span>
      }
    </a>
