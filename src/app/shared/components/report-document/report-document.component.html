@if (sent()) {
  <p class="text-[11px] text-ink-muted text-center">ส่งรายงานเอกสารนี้แล้ว</p>
} @else {
  <button
    type="button"
    class="w-full text-[11px] text-ink-muted hover:text-rose-600 transition-colors underline underline-offset-2"
    (click)="start()"
  >
    รายงานเอกสารนี้
  </button>
}

<nz-modal
  [nzVisible]="open()"
  [nzTitle]="reportTitle"
  [nzFooter]="reportFooter"
  [nzWidth]="480"
  [nzCentered]="true"
  (nzOnCancel)="cancel()"
>
  <ng-template #reportTitle>
    <div class="flex items-center gap-2.5">
      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex-shrink-0">
        <app-icon name="flag" [size]="16" />
      </span>
      <span class="font-bold text-ink text-base md:text-lg">รายงานเอกสารนี้</span>
    </div>
  </ng-template>

  <ng-container *nzModalContent>
    <div class="space-y-4">
      <p class="text-xs text-ink-muted leading-relaxed">
        บอกเราว่าเอกสารนี้มีปัญหาอย่างไร ทีมงานจะตรวจสอบและดำเนินการโดยเร็วที่สุด
      </p>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-1.5 block">เหตุผลในการรายงาน</label>
        <select class="input-soft" [(ngModel)]="category" name="category">
          @for (option of categories; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-1.5 block">อธิบายเพิ่มเติม</label>
        <textarea
          class="input-soft"
          rows="4"
          maxlength="500"
          [(ngModel)]="details"
          name="details"
          placeholder="เช่น เอกสารนี้เป็นผลงานของฉันที่ถูกนำมาขายต่อโดยไม่ได้รับอนุญาต"
        ></textarea>
        <p class="text-[11px] text-ink-muted mt-1">สูงสุด 500 ตัวอักษร</p>
      </div>
    </div>
  </ng-container>

  <ng-template #reportFooter>
    <div class="flex items-center justify-end gap-2">
      <button type="button" class="btn-ghost !py-2 !px-5 text-sm" (click)="cancel()">
        ยกเลิก
      </button>
      <button
        type="button"
        class="btn-pink !py-2 !px-5 text-sm"
        [disabled]="sending()"
        (click)="submit()"
      >
        {{ sending() ? 'กำลังส่ง…' : 'ส่งรายงาน' }}
      </button>
    </div>
  </ng-template>
</nz-modal>
