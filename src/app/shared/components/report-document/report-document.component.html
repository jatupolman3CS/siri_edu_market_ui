@if (sent()) {
  <p class="text-[11px] text-ink-muted text-center">{{ 'shared.reportDocument.reportedAlready' | trans }}</p>
} @else {
  <button
    type="button"
    class="w-full text-[11px] text-ink-muted hover:text-rose-600 transition-colors underline underline-offset-2"
    (click)="start()"
  >
    {{ 'shared.reportDocument.reportThisDoc' | trans }}
  </button>
}

<nz-modal
  [nzVisible]="open()"
  [nzTitle]="reportTitle"
  [nzFooter]="reportFooter"
  [nzWidth]="480"
  [nzCentered]="true"
  (nzOnCancel)="cancel()"
>
  <ng-template #reportTitle>
    <div class="flex items-center gap-2.5">
      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex-shrink-0">
        <app-icon name="flag" [size]="16" />
      </span>
      <span class="font-bold text-ink text-base md:text-lg">{{ 'shared.reportDocument.reportTitle' | trans }}</span>
    </div>
  </ng-template>

  <ng-container *nzModalContent>
    <div class="space-y-4">
      <p class="text-xs text-ink-muted leading-relaxed">
        {{ 'shared.reportDocument.instruction' | trans }}
      </p>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-1.5 block">{{ 'shared.reportDocument.reasonLabel' | trans }}</label>
        <select class="input-soft" [(ngModel)]="category" name="category">
          @for (option of categories(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-1.5 block">{{ 'shared.reportDocument.describeMore' | trans }}</label>
        <textarea
          class="input-soft"
          rows="4"
          maxlength="500"
          [(ngModel)]="details"
          name="details"
          [placeholder]="'shared.reportDocument.describePlaceholder' | trans"
        ></textarea>
        <p class="text-[11px] text-ink-muted mt-1">{{ 'shared.reportDocument.max500Chars' | trans }}</p>
      </div>
    </div>
  </ng-container>

  <ng-template #reportFooter>
    <div class="flex items-center justify-end gap-2">
      <button type="button" class="btn-ghost !py-2 !px-5 text-sm" (click)="cancel()">
        {{ 'common.cancel' | trans }}
      </button>
      <button
        type="button"
        class="btn-pink !py-2 !px-5 text-sm"
        [disabled]="sending()"
        (click)="submit()"
      >
        {{ sending() ? ('shared.reportDocument.submitting' | trans) : ('shared.reportDocument.submitReport' | trans) }}
      </button>
    </div>
  </ng-template>
</nz-modal>
