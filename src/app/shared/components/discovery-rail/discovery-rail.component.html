@if (section().items.length >= 3) {
  <section>
    <div class="flex flex-wrap items-end justify-between gap-3 sm:gap-4 mb-5">
      <div class="min-w-0">
        <!-- responsive-ui v1.4 R-5 (F113): section titles/reasons are data text — a long unbroken
             category name widened "/" to 672px at 360. -->
        <h2 class="heading-2 font-bold tracking-[-0.02em] text-ink [overflow-wrap:anywhere]">{{ section().title }}</h2>
        <p class="text-sm text-ink-muted mt-1 [overflow-wrap:anywhere]">{{ section().reason }}</p>
      </div>
      @if (viewAllQueryParams(); as qp) {
        <a
          [routerLink]="['/marketplace']"
          [queryParams]="qp"
          class="inline-flex items-center gap-1.5 px-4 min-h-11 rounded-full text-sm font-semibold text-pink-600 bg-white border border-line hover:bg-pink-50 hover:border-pink-300 transition-colors duration-200 whitespace-nowrap"
        >
          {{ 'common.viewAll' | trans }}
          <app-icon name="arrow-right" [size]="16" />
        </a>
      }
    </div>
    <div class="document-card-grid">
      @for (doc of section().items; track doc.id) {
        <app-document-card [doc]="doc" density="compact" />
      }
    </div>
  </section>
}
