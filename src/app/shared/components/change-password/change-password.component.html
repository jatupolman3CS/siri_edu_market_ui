<section class="card-soft p-6" id="password">
  <div class="flex items-start gap-3 mb-5">
    <div class="w-11 h-11 rounded-2xl bg-pink-50 text-pink-600 flex items-center justify-center flex-shrink-0">
      <app-icon name="lock" [size]="18" />
    </div>
    <div>
      <h2 class="text-lg font-bold text-ink mb-1">เปลี่ยนรหัสผ่าน</h2>
      <p class="text-xs text-ink-muted">
        ต้องยืนยันรหัสผ่านปัจจุบันก่อน — เปลี่ยนแล้วทุกอุปกรณ์จะต้องเข้าสู่ระบบใหม่
      </p>
    </div>
  </div>

  <div class="grid sm:grid-cols-3 gap-4">
    <div>
      <label class="text-xs font-semibold text-ink-soft mb-2 block">รหัสผ่านปัจจุบัน</label>
      <input
        type="password"
        class="input-soft"
        [(ngModel)]="currentPassword"
        name="currentPassword"
        autocomplete="current-password"
        maxlength="128"
      />
    </div>
    <div>
      <label class="text-xs font-semibold text-ink-soft mb-2 block">รหัสผ่านใหม่</label>
      <input
        type="password"
        class="input-soft"
        [(ngModel)]="newPassword"
        name="newPassword"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
      />
    </div>
    <div>
      <label class="text-xs font-semibold text-ink-soft mb-2 block">ยืนยันรหัสผ่านใหม่</label>
      <input
        type="password"
        class="input-soft"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        autocomplete="new-password"
        maxlength="128"
      />
    </div>
  </div>

  <div class="flex justify-end mt-6">
    <button type="button" class="btn-pink !px-7" [disabled]="saving()" (click)="submit()">
      {{ saving() ? 'กำลังบันทึก…' : 'เปลี่ยนรหัสผ่าน' }}
    </button>
  </div>
</section>
