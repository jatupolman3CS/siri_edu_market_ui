<nz-modal
  [nzVisible]="!!popup.current()"
  [nzTitle]="popup.current()?.title"
  [nzFooter]="null"
  [nzWidth]="'min(90vw, 560px)'"
  (nzOnCancel)="popup.close()"
>
  <ng-container *nzModalContent>
    @if (popup.current(); as announcement) {
      <div class="flex flex-col gap-4">
        <div class="relative">
          <nz-carousel [nzDots]="announcement.images.length > 1" [nzEnableSwipe]="true">
            @for (image of announcement.images; track image.id; let i = $index) {
              <div nz-carousel-content>
                <img
                  appImgFallback
                  [src]="image.imageUrl"
                  [alt]="image.altText || fallbackAlt(image, i)"
                  class="w-full aspect-[4/3] object-cover rounded-2xl"
                  [class.cursor-pointer]="!!image.linkUrl"
                  (click)="onImageClick(image)"
                />
              </div>
            }
          </nz-carousel>

          @if (announcement.images.length > 1) {
            <button
              type="button"
              class="btn-icon absolute top-1/2 left-2 -translate-y-1/2 z-10 !border-0 !bg-white/90 shadow-soft"
              aria-label="รูปก่อนหน้า"
              (click)="onArrowLeft()"
            >
              <app-icon name="arrow-left" [size]="16" />
            </button>
            <button
              type="button"
              class="btn-icon absolute top-1/2 right-2 -translate-y-1/2 z-10 !border-0 !bg-white/90 shadow-soft"
              aria-label="รูปถัดไป"
              (click)="onArrowRight()"
            >
              <app-icon name="arrow-right" [size]="16" />
            </button>
          }
        </div>

        <button
          type="button"
          class="btn-ghost w-full"
          (click)="popup.dismissForever(announcement.id)"
        >
          ไม่ต้องแสดงอีก
        </button>
      </div>
    }
  </ng-container>
</nz-modal>
