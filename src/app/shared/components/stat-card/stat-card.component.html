<div class="card-tile h-full gap-2 p-4 sm:p-5 md:p-6">
      <!-- Label: wraps to as many lines as it needs (no clamp — two clamped KPIs used to read the
           same, e.g. "DOCUMENTS WITH…"), and a word wider than the phone box breaks instead of being
           cut mid-letter. -->
      <div class="flex flex-wrap items-start justify-between gap-2 text-ink-muted">
        <span
          class="min-w-0 flex-1 text-xs font-semibold uppercase tracking-wide sm:tracking-wider [overflow-wrap:anywhere] [hyphens:auto]"
          [attr.title]="label()"
        >{{ label() }}</span>
        <span class="text-xl sm:text-2xl shrink-0 leading-none" aria-hidden="true">{{ icon() }}</span>
      </div>
      <!-- Value: 20px below 640 fits a 6-digit amount in the 2-column phone tile; pass money through
           `thb: true : 'compact'` (≥1M → ฿1.23M) and the full amount as `valueTitle`. break-words is
           only a safety net for text values. -->
      <div
        class="card-tile-body min-w-0 text-xl sm:text-2xl md:text-3xl font-extrabold text-ink tabular-nums leading-tight break-words"
        [attr.title]="valueTitle() || null"
      >
        @if (unit()) {
          <span class="whitespace-nowrap">{{ value() }}</span>
          <span class="ml-1 text-sm font-semibold text-ink-muted">{{ unit() }}</span>
        } @else {
          {{ value() }}
        }
      </div>
      @if (trend()) {
        <div class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-xs">
          <span
            [class]="
              trend()!.startsWith('-')
                ? 'text-rose-500'
                : 'text-emerald-500'
            "
            class="font-semibold"
          >
            {{ trend() }}
          </span>
          <span class="min-w-0 break-words text-ink-muted">{{ resolvedTrendLabel() }}</span>
        </div>
      }
    </div>
