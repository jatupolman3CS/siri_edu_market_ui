<div class="card-tile h-full gap-2">
      <div class="flex items-center justify-between gap-2 text-ink-muted">
        <span class="text-xs font-semibold uppercase tracking-wider line-clamp-2">{{ label() }}</span>
        <span class="text-2xl shrink-0">{{ icon() }}</span>
      </div>
      <div class="card-tile-body text-2xl md:text-3xl font-extrabold text-ink">
        {{ value() }}
      </div>
      @if (trend()) {
        <div class="flex items-center gap-1 text-xs">
          <span
            [class]="
              trend()!.startsWith('-')
                ? 'text-rose-500'
                : 'text-emerald-500'
            "
            class="font-semibold"
          >
            {{ trend() }}
          </span>
          <span class="text-ink-muted">{{ resolvedTrendLabel() }}</span>
        </div>
      }
    </div>
