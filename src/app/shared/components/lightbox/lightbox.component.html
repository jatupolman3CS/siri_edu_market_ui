@if (lightbox.current(); as item) {
  <div
    class="fixed inset-0 z-[999] bg-black/80 flex items-center justify-center p-6"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    (click)="close()"
    (keydown)="onBackdropKeydown($event)"
  >
    <img
      [src]="item.src"
      [alt]="item.alt"
      class="max-w-full max-h-full rounded-2xl shadow-pop object-contain"
      (click)="$event.stopPropagation()"
    />
    <button
      type="button"
      class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/90 flex items-center justify-center text-ink text-lg font-bold"
      aria-label="ปิด"
      (click)="close()"
    >
      &times;
    </button>
  </div>
}
