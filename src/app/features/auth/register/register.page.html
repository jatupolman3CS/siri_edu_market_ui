<app-auth-layout
  [artTitle]="'auth.artTitleRegister' | trans"
  [artDescription]="'auth.artDescRegister' | trans"
>
  <div class="max-w-md w-full mx-auto">
    <span class="pill-pink mb-4">
      <span class="w-1.5 h-1.5 rounded-full bg-pink-500"></span>
      {{ 'auth.newMember' | trans }}
    </span>
    <h1 class="text-3xl font-extrabold text-ink mb-2 leading-tight">
      {{ 'auth.registerTitle' | trans }}
    </h1>
    <p class="text-sm text-ink-soft mb-8">
      {{ 'auth.alreadyHaveAccount' | trans }}
      <a
        [routerLink]="['/auth/login']"
        [queryParams]="{ returnUrl: returnUrl() }"
        class="text-pink-600 font-bold hover:underline"
      >
        {{ 'auth.signInHere' | trans }}
      </a>
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">{{ 'auth.fullNameLabel' | trans }}</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-muted">
            <app-icon name="user" [size]="18" />
          </span>
          <input
            type="text"
            [(ngModel)]="name"
            name="name"
            class="input-soft !pl-12"
            [placeholder]="'auth.fullNamePlaceholder' | trans"
            autocomplete="name"
            required
          />
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">{{ 'auth.emailLabel' | trans }}</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-muted">
            <app-icon name="mail" [size]="18" />
          </span>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            class="input-soft !pl-12"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'auth.passwordLabel' | trans }} <span class="text-ink-muted">{{ 'auth.atLeast6Chars' | trans }}</span>
        </label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-muted">
            <app-icon name="lock" [size]="18" />
          </span>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            class="input-soft !pl-12 !pr-12"
            placeholder="•••••••••"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-ink-muted hover:text-pink-600"
            (click)="showPassword.set(!showPassword())"
          >
            <app-icon [name]="showPassword() ? 'eye' : 'lock'" [size]="16" />
          </button>
        </div>

        <!-- Strength meter -->
        @if (password().length > 0) {
          <div class="flex gap-1 mt-2">
            @for (i of [1, 2, 3, 4]; track i) {
              <div
                class="flex-1 h-1 rounded-full transition-colors"
                [class.bg-pink-500]="strengthLevel() >= i"
                [class.bg-pink-100]="strengthLevel() < i"
              ></div>
            }
          </div>
          <div class="text-[11px] mt-1.5" [class]="strengthColor()">
            {{ strengthLabel() }}
          </div>
        }
      </div>

      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">{{ 'auth.confirmPasswordLabel' | trans }}</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-muted">
            <app-icon name="lock" [size]="18" />
          </span>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            class="input-soft !pl-12"
            [placeholder]="'auth.retypePasswordPlaceholder' | trans"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <label class="flex items-start gap-2 text-sm text-ink-soft cursor-pointer">
        <input
          type="checkbox"
          [(ngModel)]="acceptTerms"
          name="acceptTerms"
          required
          class="w-4 h-4 accent-pink-500 mt-0.5"
        />
        <span>
          {{ 'auth.termsAccept' | trans }}
          <span class="text-pink-600 font-semibold">{{ 'footer.terms' | trans }}</span>
          {{ 'auth.and' | trans }}
          <span class="text-pink-600 font-semibold">{{ 'footer.privacy' | trans }}</span>
        </span>
      </label>

      @if (error()) {
        <div class="px-4 py-2.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-600 text-sm flex items-center gap-2">
          <app-icon name="flag" [size]="14" />
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        class="btn-pink w-full !py-3.5 mt-2 text-base"
        [disabled]="loading() || !acceptTerms()"
      >
        @if (loading()) {
          <span class="inline-block animate-spin">✦</span>
          {{ 'common.loading' | trans }}
        } @else {
          {{ 'auth.submitRegister' | trans }}
          <app-icon name="arrow-right" [size]="16" />
        }
      </button>
    </form>

    <p class="text-[11px] text-ink-muted text-center mt-5">
      {{ 'auth.pdpaNotice' | trans }}
    </p>
  </div>

</app-auth-layout>
