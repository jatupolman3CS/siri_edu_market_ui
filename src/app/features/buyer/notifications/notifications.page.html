<div class="max-w-3xl mx-auto px-4 lg:px-6 py-8">
  <app-page-hero
    eyebrow="การแจ้งเตือน"
    title="การแจ้งเตือนของคุณ"
    description="ข่าวสารเอกสารใหม่จากร้านที่คุณติดตาม"
  />

  @if (feed.loading() && feed.items().length === 0) {
    <app-empty-state emoji="⏳" title="กำลังโหลดการแจ้งเตือน…" description="รอสักครู่นะคะ" />
  } @else if (feed.items().length === 0) {
    <app-empty-state
      emoji="🔔"
      title="ยังไม่มีการแจ้งเตือน"
      description="ลองติดตามร้านที่ชอบเพื่อรับข่าวเอกสารใหม่ก่อนใคร"
    >
      <a routerLink="/marketplace" class="btn-pink mt-4">ค้นหาร้านที่ชอบ</a>
    </app-empty-state>
  } @else {
    <ul class="flex flex-col gap-3">
      @for (item of feed.items(); track item.id) {
        @let style = getStyle(item.key, item.title);
        <li>
          <button
            type="button"
            class="w-full text-left card-soft p-4 md:p-5 flex items-start gap-4 transition-all hover:shadow-pop hover:-translate-y-0.5 group"
            [class.bg-gradient-to-r]="!item.isRead"
            [class.from-pink-50/70]="!item.isRead"
            [class.to-white]="!item.isRead"
            [class.border-pink-200]="!item.isRead"
            (click)="onItemClick(item)"
          >
            <div
              class="w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110"
              [class]="!item.isRead ? style.iconUnreadBgClass : style.iconBgClass"
            >
              <app-icon [name]="style.icon" [size]="18" />
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-xs font-bold px-2 py-0.5 rounded leading-none shrink-0" [class]="style.badgeClass">
                    {{ style.label }}
                  </span>
                  <p class="text-sm md:text-base text-ink leading-snug truncate" [class.font-bold]="!item.isRead" [class.font-semibold]="item.isRead">
                    {{ item.title }}
                  </p>
                </div>
                @if (!item.isRead) {
                  <span class="pill-pink text-[10px] !py-0.5 !px-2 flex-shrink-0">
                    ใหม่
                  </span>
                }
              </div>

              <p class="text-xs md:text-sm text-ink-soft mt-1.5 leading-relaxed whitespace-pre-wrap">{{ item.body }}</p>

              <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-line/50">
                <span class="text-xs text-ink-muted flex items-center gap-1">
                  {{ item.createdAt | timeAgo }}
                </span>

                <span class="text-xs font-semibold text-pink-600 inline-flex items-center gap-1 group-hover:translate-x-0.5 transition-transform">
                  ดูรายละเอียด
                  <app-icon name="arrow-right" [size]="12" />
                </span>
              </div>
            </div>
          </button>
        </li>
      }
    </ul>

    @if (hasMore()) {
      <div class="flex justify-center mt-8">
        <button
          type="button"
          class="btn-pink shadow-soft hover:shadow-pop transition-all"
          (click)="loadMore()"
          [disabled]="feed.loading()"
        >
          {{ feed.loading() ? 'กำลังโหลด…' : 'โหลดเพิ่มเติม' }}
        </button>
      </div>
    }
  }
</div>
