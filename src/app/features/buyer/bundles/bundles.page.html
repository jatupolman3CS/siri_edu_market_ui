<div class="max-w-7xl mx-auto px-4 lg:px-6 py-8">
      <app-page-hero
        eyebrow="แพ็กเกจคุ้มสุดคุ้ม"
        title="ซื้อชุดคุ้มกว่า ใช้ได้ครบทั้งคอร์ส 📦"
        description="รวมเอกสารและเทมเพลตที่เข้าคู่กัน ราคาประหยัดกว่าซื้อแยกถึง 40%"
      />

      @if (bundleService.bundlesState().status === 'loading') {
        <app-empty-state
          emoji="⏳"
          title="กำลังโหลดแพ็กเกจ…"
          description="รอสักครู่นะคะ"
        />
      } @else if (bundleService.bundlesState().status === 'error') {
        <app-empty-state
          emoji="⚠️"
          title="โหลดแพ็กเกจไม่สำเร็จ"
          description="ลองใหม่อีกครั้ง"
        >
          <button class="btn-pink mt-5" type="button" (click)="bundleService.refreshBundles()">
            ลองใหม่
          </button>
        </app-empty-state>
      } @else if (bundleService.bundles().length === 0) {
        <app-empty-state
          emoji="📦"
          title="ยังไม่มีแพ็กเกจ"
          description="ตอนนี้ยังไม่มีแพ็กเกจที่เปิดขาย"
        />
      } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (bundle of bundleService.bundles(); track bundle.id) {
            <app-bundle-card [bundle]="bundle" />
          }
        </div>
      }
    </div>
