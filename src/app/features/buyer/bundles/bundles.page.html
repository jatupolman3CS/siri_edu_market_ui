<div class="page-container py-5 md:py-8">
      @if (bundleService.bundlesState().status === 'loading') {
        <app-empty-state
          emoji="⏳"
          [title]="'bundles.loading' | trans"
          [description]="'common.pleaseWait' | trans"
        />
      } @else if (bundleService.bundlesState().status === 'error') {
        <app-empty-state
          emoji="⚠️"
          [title]="'bundles.loadFailed' | trans"
          [description]="'common.retry' | trans"
        >
          <button class="btn-pink mt-5" type="button" (click)="bundleService.refreshBundles()">
            {{ 'common.retry' | trans }}
          </button>
        </app-empty-state>
      } @else if (bundleService.bundles().length === 0) {
        <app-empty-state
          emoji="📦"
          [title]="'bundles.emptyTitle' | trans"
          [description]="'bundles.emptyDesc' | trans"
        />
      } @else {
        <!-- responsive-ui v1.4 (F123): two columns from 560 — one card stretched to 568–654px between
             600 and 743 (Split View, Fold inner screen). Bundle cards fit down to ~250px (F168). -->
        <div class="grid grid-cols-1 min-[560px]:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
          @for (bundle of bundleService.bundles(); track bundle.id) {
            <app-bundle-card [bundle]="bundle" />
          }
        </div>
      }
    </div>
