<section class="card-soft p-4 sm:p-6" id="shortcuts">
  <h2 class="text-lg font-bold text-ink mb-1">{{ 'account.shortcutsTitle' | trans }}</h2>
  <p class="text-xs text-ink-muted mb-5">{{ 'account.shortcutsDesc' | trans }}</p>

  <ul class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    @for (shortcut of shortcuts; track shortcut.href) {
      <li>
        <a
          [routerLink]="shortcut.href"
          class="block h-full p-4 rounded-2xl border border-line hover:border-brand-300 hover:shadow-soft transition-all"
        >
          <span class="text-2xl">{{ shortcut.emoji }}</span>
          <div class="text-sm font-semibold text-ink mt-2">{{ shortcut.label }}</div>
          <div class="text-xs text-ink-muted">{{ shortcut.description }}</div>
        </a>
      </li>
    }
  </ul>
</section>
