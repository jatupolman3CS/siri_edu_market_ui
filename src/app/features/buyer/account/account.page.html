<div class="page-container py-6 sm:py-8">
  <header
    class="card-soft p-4 sm:p-6 md:p-8 mb-6 bg-gradient-to-r from-brand-50/40 via-surface to-brand-50/20 border border-line"
  >
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-brand-100 text-brand-700 border border-line mb-3">
      <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
      <span>{{ 'account.badge' | trans }}</span>
    </div>
    <h1 class="heading-1 font-extrabold text-ink mb-1.5">{{ 'account.title' | trans }}</h1>
    <p class="text-sm sm:text-base text-ink-soft">{{ 'account.desc' | trans }}</p>
  </header>

  <!-- responsive-ui v1.4 §4.6 C (F120): one column capped at 640px below 1024 (the profile form
       stretched to 646–722px at 744–1023); the aside sticks 16px below the pinned header (§4.4:
       114px at 744–1279, 171px at ≥1280). -->
  <div class="grid grid-cols-1 lg:grid-cols-[17rem_minmax(0,1fr)] gap-6 items-start max-w-[640px] mx-auto lg:max-w-none">
    <!-- Section nav -->
    <aside class="lg:sticky lg:top-[130px] xl:top-[187px] flex flex-col gap-4 min-w-0">
      @if (auth.user(); as u) {
        <div class="card-soft p-4 flex items-center gap-3">
          <img
            appImgFallback
            [src]="avatarSrc()"
            class="w-12 h-12 rounded-2xl object-cover ring-2 ring-brand-100 flex-shrink-0"
            [alt]="u.name"
          />
          <div class="min-w-0">
            <div class="text-sm font-bold text-ink truncate">{{ u.name }}</div>
            <div class="text-xs text-ink-muted truncate">{{ u.email | displayEmail }}</div>
          </div>
        </div>
      }

      <nav class="card-soft p-2 chip-row gap-1 lg:flex-col lg:overflow-visible">
        @for (item of sectionNav; track item.path) {
          <a
            [routerLink]="item.path.startsWith('/') ? item.path : ['/account', item.path]"
            routerLinkActive="!bg-brand-50 !text-brand-600 !border-line font-semibold"
            ariaCurrentWhenActive="page"
            class="flex items-center gap-3 min-h-11 px-4 py-3 rounded-2xl text-sm font-medium text-ink-soft border border-transparent hover:bg-brand-50 hover:text-brand-600 transition-colors whitespace-nowrap"
          >
            <app-icon [name]="item.icon" [size]="18" />
            <span class="flex-1">{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>

    <!-- Section page: each sidebar entry is its own child route (account.routes.ts). -->
    <div class="min-w-0">
      <router-outlet />
    </div>
  </div>
</div>
