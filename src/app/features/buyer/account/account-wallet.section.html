<section id="wallet" class="card-soft p-4 sm:p-6 border border-line">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 text-ink-muted text-xs font-semibold mb-1">
        <app-icon name="wallet" [size]="16" />
        <span>{{ 'account.walletCardTitle' | trans }}</span>
      </div>
      <div class="text-xs text-ink-muted mb-2">{{ 'account.walletBalanceLabel' | trans }}</div>
      <div class="text-2xl sm:text-3xl font-extrabold text-ink tracking-tight">
        @if (wallet.summary()?.balance != null) {
          {{ wallet.summary()!.balance | thb }}
        } @else {
          —
        }
      </div>
    </div>
    <a
      [routerLink]="['/wallet']"
      class="inline-flex items-center justify-center gap-2 min-h-11 px-4 py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs font-semibold shadow-sm transition-colors"
    >
      <app-icon name="plus" [size]="16" />
      <span>{{ 'account.walletManageBtn' | trans }}</span>
    </a>
  </div>
</section>
