<div class="max-w-3xl">
  <header class="mb-8">
    <h1 class="text-3xl font-extrabold text-ink mb-1">จัดการเนื้อหาหน้า Exam Hub</h1>
    <p class="text-sm text-ink-soft">
      ปรับแต่งเนื้อหาข้อมูลการสอบ เกณฑ์คะแนน และเทรนด์ข้อสอบสำหรับแต่ละสนามสอบ
    </p>
  </header>

  <!-- Exam Type Selector -->
  <section class="card-soft p-6 mb-6">
    <label class="text-sm font-bold text-ink mb-2 block">เลือกสนามสอบ</label>
    <select
      class="input-soft cursor-pointer text-sm font-medium w-full sm:w-72"
      [ngModel]="selectedExamType()"
      (ngModelChange)="onExamTypeChange($event)"
      [disabled]="loading() || saving()"
    >
      @for (t of examTypes; track t.value) {
        <option [value]="t.value">{{ t.label }}</option>
      }
    </select>
  </section>

  <!-- Content Form -->
  <section class="card-soft p-6 mb-6">
    <h2 class="text-lg font-bold text-ink mb-4 flex items-center gap-2">
      <app-icon name="edit" [size]="18" className="text-pink-500" />
      <span>เนื้อหาสำหรับ {{ selectedExamType().toUpperCase() }}</span>
    </h2>

    <div class="space-y-5">
      <!-- Title -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          หัวข้อหน้า (Title) <span class="text-pink-500">*</span>
        </label>
        <textarea
          rows="2"
          class="input-soft"
          placeholder="เช่น TGAT/TPAT — เตรียมสอบวัดความถนัด"
          [ngModel]="form().title"
          (ngModelChange)="patch('title', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Meta Description -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          คำอธิบายสำหรับ SEO (Meta Description) <span class="text-pink-500">*</span>
        </label>
        <textarea
          rows="2"
          class="input-soft"
          placeholder="คำอธิบายสั้น ๆ ไม่เกิน 160-300 ตัวอักษร"
          [ngModel]="form().metaDescription"
          (ngModelChange)="patch('metaDescription', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Intro Text -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          ข้อความเกริ่นนำ (Intro Text) <span class="text-pink-500">*</span>
        </label>
        <textarea
          rows="3"
          class="input-soft"
          placeholder="ข้อความแนะนำและเกริ่นนำด้านบนของหน้า"
          [ngModel]="form().introText"
          (ngModelChange)="patch('introText', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Exam Date Info -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          กำหนดการสอบ (วันสอบ / ปฏิทินรับสมัคร)
        </label>
        <textarea
          rows="3"
          class="input-soft"
          placeholder="เช่น 10-12 ธันวาคม 2569 (ปล่อยว่างหากยังไม่มี)"
          [ngModel]="form().examDateInfo"
          (ngModelChange)="patch('examDateInfo', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Score Criteria Info -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          เกณฑ์คะแนน (การใช้คะแนน / ค่าน้ำหนัก)
        </label>
        <textarea
          rows="3"
          class="input-soft"
          placeholder="เช่น ใช้คะแนน TGAT 20%, TPAT 30% (ปล่อยว่างหากยังไม่มี)"
          [ngModel]="form().scoreCriteriaInfo"
          (ngModelChange)="patch('scoreCriteriaInfo', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Trend Info -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          เทรนด์ข้อสอบ (แนวข้อสอบ / จุดที่ควรเน้น)
        </label>
        <textarea
          rows="3"
          class="input-soft"
          placeholder="เช่น เน้นโจทย์สถานการณ์ประยุกต์ (ปล่อยว่างหากยังไม่มี)"
          [ngModel]="form().trendInfo"
          (ngModelChange)="patch('trendInfo', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>
    </div>

    <div class="flex justify-end mt-6 pt-5 border-t border-line">
      <button
        type="button"
        class="btn-pink px-8 py-2.5 font-medium"
        (click)="save()"
        [disabled]="loading() || saving()"
      >
        @if (saving()) {
          <span>กำลังบันทึก…</span>
        } @else {
          <span>บันทึก</span>
        }
      </button>
    </div>
  </section>
</div>
