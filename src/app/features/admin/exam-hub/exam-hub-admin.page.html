<div class="min-w-0">
  <header class="mb-8">
    <h1 class="heading-1 font-extrabold text-ink mb-1">{{ 'admin.examHub.title' | trans }}</h1>
    <p class="text-sm text-ink-soft">
      {{ 'admin.examHub.desc' | trans }}
    </p>
  </header>

  <!-- responsive-ui v1.5 R-26 item 3: from xl the exam-type picker becomes a 360px side column next to
       the content form, whose fields flow into 2 columns. Below xl: one minmax(0,1fr) track, unchanged. -->
  <div class="grid grid-cols-1 xl:grid-cols-[360px_minmax(0,1fr)] gap-x-6 xl:items-start">
  <!-- Exam Type Selector -->
  <section class="card-soft p-4 md:p-6 mb-6">
    <label class="text-sm font-bold text-ink mb-2 block">{{ 'admin.examHub.selectLabel' | trans }}</label>
    <select
      class="input-soft cursor-pointer text-sm font-medium w-full sm:w-72 xl:w-full"
      [ngModel]="selectedExamType()"
      (ngModelChange)="onExamTypeChange($event)"
      [disabled]="loading() || saving()"
    >
      @for (t of examTypes; track t.value) {
        <option [value]="t.value">{{ t.label }}</option>
      }
    </select>
  </section>

  <!-- Content Form -->
  <section class="card-soft p-4 md:p-6 mb-6">
    <h2 class="text-lg font-bold text-ink mb-4 flex items-center gap-2">
      <app-icon name="edit" [size]="18" className="text-pink-500" />
      <span>{{ 'admin.examHub.contentFor' | trans }} {{ selectedExamType().toUpperCase() }}</span>
    </h2>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
      <!-- Title -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'admin.examHub.titleLabel' | trans }} <span class="text-pink-500">*</span>
        </label>
        <textarea
          rows="2"
          class="input-soft"
          [placeholder]="'admin.examHub.titlePlaceholder' | trans"
          [ngModel]="form().title"
          (ngModelChange)="patch('title', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Meta Description -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'admin.examHub.metaLabel' | trans }} <span class="text-pink-500">*</span>
        </label>
        <textarea
          rows="2"
          class="input-soft"
          [placeholder]="'admin.examHub.metaPlaceholder' | trans"
          [ngModel]="form().metaDescription"
          (ngModelChange)="patch('metaDescription', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Intro Text -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'admin.examHub.introLabel' | trans }} <span class="text-pink-500">*</span>
        </label>
        <textarea
          rows="3"
          class="input-soft"
          [placeholder]="'admin.examHub.introPlaceholder' | trans"
          [ngModel]="form().introText"
          (ngModelChange)="patch('introText', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Exam Date Info -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'admin.examHub.examDateLabel' | trans }}
        </label>
        <textarea
          rows="3"
          class="input-soft"
          [placeholder]="'admin.examHub.examDatePlaceholder' | trans"
          [ngModel]="form().examDateInfo"
          (ngModelChange)="patch('examDateInfo', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Score Criteria Info -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'admin.examHub.scoreLabel' | trans }}
        </label>
        <textarea
          rows="3"
          class="input-soft"
          [placeholder]="'admin.examHub.scorePlaceholder' | trans"
          [ngModel]="form().scoreCriteriaInfo"
          (ngModelChange)="patch('scoreCriteriaInfo', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>

      <!-- Trend Info -->
      <div>
        <label class="text-xs font-semibold text-ink-soft mb-2 block">
          {{ 'admin.examHub.trendLabel' | trans }}
        </label>
        <textarea
          rows="3"
          class="input-soft"
          [placeholder]="'admin.examHub.trendPlaceholder' | trans"
          [ngModel]="form().trendInfo"
          (ngModelChange)="patch('trendInfo', $event)"
          [disabled]="loading() || saving()"
        ></textarea>
      </div>
    </div>

    <div class="flex justify-end mt-6 pt-5 border-t border-line">
      <button
        type="button"
        class="btn-pink px-8 py-2.5 font-medium"
        (click)="save()"
        [disabled]="loading() || saving()"
      >
        @if (saving()) {
          <span>{{ 'admin.examHub.saving' | trans }}</span>
        } @else {
          <span>{{ 'admin.examHub.saveBtn' | trans }}</span>
        }
      </button>
    </div>
  </section>
  </div>
</div>
