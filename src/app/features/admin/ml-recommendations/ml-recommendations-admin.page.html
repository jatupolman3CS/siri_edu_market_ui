<div class="space-y-6">
  <header>
    <h1 class="text-2xl font-extrabold text-ink">{{ 'admin.mlAdmin.title' | trans }}</h1>
    <p class="text-sm text-ink-soft">
      {{ 'admin.mlAdmin.desc' | trans }}
    </p>
  </header>

  @if (loading()) {
    <div class="card-soft p-8 text-center text-sm text-ink-soft">{{ 'common.loading' | trans }}</div>
  } @else {
    @let ov = overview();

    @if (!ov?.lastComputedAt) {
      <div class="card-soft p-4 border border-amber-200 bg-amber-50 text-amber-800 text-sm">
        {{ 'admin.mlAdmin.neverComputedAlert' | trans }}
      </div>
    }

    <section class="grid grid-cols-2 lg:grid-cols-3 gap-4">
      <app-stat-card
        [label]="'admin.mlAdmin.statEmbedDocs' | trans"
        [value]="(ov?.documentsWithEmbeddingCount ?? 0) + ' ' + ('admin.mlAdmin.statDocUnit' | trans)"
        icon="🧬"
      />
      <app-stat-card
        [label]="'admin.mlAdmin.statRecommendDocs' | trans"
        [value]="(ov?.documentsWithBoughtTogetherCount ?? 0) + ' ' + ('admin.mlAdmin.statDocUnit' | trans)"
        icon="🔗"
      />
      <app-stat-card
        [label]="'admin.mlAdmin.statPairs' | trans"
        [value]="(ov?.totalSimilarityPairs ?? 0) + ' ' + ('admin.mlAdmin.statPairUnit' | trans)"
        icon="🧮"
      />
      <app-stat-card
        [label]="'admin.mlAdmin.statAvgCoPurchase' | trans"
        [value]="((ov?.averageCoPurchaseCount ?? 0) | number: '1.1-1') + ' ' + ('admin.mlAdmin.statAvgCoPurchaseUnit' | trans)"
        icon="🛒"
      />
      <app-stat-card
        [label]="'admin.mlAdmin.statMinThreshold' | trans"
        [value]="(ov?.minCoPurchaseThreshold ?? 0) + ' ' + ('admin.mlAdmin.statMinUnit' | trans)"
        icon="🎯"
      />
      <app-stat-card
        [label]="'admin.mlAdmin.statEmbedDimensions' | trans"
        [value]="(ov?.embeddingDimensions ?? 0) + ' ' + ('admin.mlAdmin.statDimUnit' | trans)"
        icon="📐"
      />
      <app-stat-card
        [label]="'admin.mlAdmin.statLastComputed' | trans"
        [value]="ov?.lastComputedAt ? ((ov!.lastComputedAt | date: 'd MMM yyyy HH:mm') ?? '') : ('admin.mlAdmin.neverComputedAlert' | trans)"
        icon="🕒"
      />
    </section>
  }
</div>
