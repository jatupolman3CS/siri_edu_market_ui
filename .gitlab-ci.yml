# Pipeline for siriedumarket-web.
#
# The three scripts under scripts/ existed but nothing ever ran them, so architectural
# violations, SDK drift and orphaned endpoints could only be caught by remembering to check.
#
# Two jobs need the backend and degrade gracefully without it:
#   api-drift        needs BACKEND_PROJECT_ID set to the backend project's numeric id, so the
#                    openapi.json artifact from its pipeline can be downloaded.
#   endpoint-coverage needs BACKEND_REPO_URL set to a clone URL the runner can read.
# Both skip with a message rather than failing when the variable is absent.

stages:
  - install
  - verify
  - build

default:
  image: node:22-alpine
  tags:
    - docker

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm

install:
  stage: install
  script:
    - npm ci
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules/

# Enforces the boundary rules: features must go through core/services, never the generated
# SDK directly, and core must not use `any`.
audit-guard:
  stage: verify
  needs: [install]
  script:
    - npm run audit:guard

unit-tests:
  stage: verify
  needs: [install]
  script:
    - npx ng test --watch=false

# Angular shipped XSS sanitisation bypasses in the version this project was pinned to. Only
# production dependencies are gated - a dev-only advisory should not block a merge.
dependency-audit:
  stage: verify
  needs: [install]
  script:
    - npm audit --omit=dev --audit-level=high

api-drift:
  stage: verify
  needs: [install]
  script:
    - |
      if [ -z "$BACKEND_PROJECT_ID" ]; then
        echo "BACKEND_PROJECT_ID is not set - skipping the OpenAPI drift check."
        echo "Set it to the backend project's numeric id to enable this job."
        exit 0
      fi
      apk add --no-cache curl
      curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$BACKEND_PROJECT_ID/jobs/artifacts/main/raw/openapi.json?job=openapi" \
        -o backend-openapi.json
      OPENAPI_FILE=backend-openapi.json node scripts/verify-api-drift.mjs
  allow_failure: false

endpoint-coverage:
  stage: verify
  needs: [install]
  script:
    - |
      if [ -z "$BACKEND_REPO_URL" ]; then
        echo "BACKEND_REPO_URL is not set - skipping the endpoint coverage cross-check."
        exit 0
      fi
      apk add --no-cache git
      git clone --depth 1 "$BACKEND_REPO_URL" ../siri_edu_market_backend
      npm run audit:coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.md

build:
  stage: build
  needs: [install]
  script:
    - npx ng build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
